<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
    @for (photo of photos(); track photo.id) {
        <div class="card bg-base-100 shadow-md border border-base-200 overflow-hidden rounded-xl">
            <img [src]="photo.url" class="aspect-square object-cover w-full" alt="user photo awaiting moderation">
    
            <div class="card-body p-2 flex flex-col sm:flex-row gap-2">
                <button class="btn btn-success btn-sm flex-1" (click)="approvePhoto(photo.id)">Approve</button>
                <button class="btn btn-error btn-sm flex-1" (click)="rejectPhoto(photo.id)">Reject</button>
            </div>
        </div>
    }
</div>
@if (photos().length === 0) {
    <div class="card bg-base-100 p-8 text-center text-base-content/70 shadow-sm border border-base-200 rounded-2xl">
        No photos awaiting approval
    </div>
}
