@if (member(); as member) {
<div routerLink="/members/{{member.id}}" class="card cursor-pointer transition-all duration-300 ease-in-out 
        transform hover:-translate-y-2 relative overflow-hidden rounded-2xl shadow-md border border-base-200">
    <img [src]="member?.imageUrl || '/user.png'" alt="{{member.displayName}} image" class="w-full aspect-square object-cover">
    
    @if (isOnline()) {
        <span class="status status-success status-xl absolute top-3 left-3 z-40"></span>
    }
    
    <button (click)="toggleLike($event)" class="absolute top-2 right-2 z-40 btn btn-ghost btn-circle bg-black/40 hover:bg-black/60 border-none text-white">
        <svg xmlns="http://www.w3.org/2000/svg" 
            [attr.fill]="hasLiked() ? 'red' : 'none'" 
            viewBox="0 0 24 24" 
            stroke-width="2" 
            stroke="currentColor"
            class="size-6"
            [class.text-red-500]="hasLiked()"
        >
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
    </button>

    <div class="card-actions z-40 
            absolute bottom-0 w-full px-4 py-3 rounded-b-2xl
            bg-gradient-to-t from-black/90 via-black/50 to-transparent
        ">
        <div class="flex flex-col text-white">
            <span class="font-bold text-base">{{member.displayName}}, {{member.dateOfBirth | age}}</span>
            <span class="text-xs opacity-80">{{member.city}}</span>
        </div>
    </div>
</div>
}
