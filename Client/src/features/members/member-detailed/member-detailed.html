@if (memberService.member(); as member) {
<div class="flex flex-col lg:flex-row gap-6 items-start">
    <!-- Left Member Sidebar Card -->
    <div class="card bg-base-100 shadow-xl border border-base-200 w-full lg:w-80 lg:shrink-0 rounded-2xl overflow-hidden">
        <div class="p-6 pb-3 flex justify-center bg-base-200/40">
            <img 
                [src]="member.imageUrl || '/user.png'" 
                alt="image of {{member.displayName}}"
                class="rounded-full size-40 object-cover shadow-md border-4 border-base-100">
        </div>
        
        <div class="card-body p-6 pt-3 flex flex-col justify-between">
            <div>
                <div class="flex flex-col items-center text-center">
                    <div class="text-2xl font-bold text-primary">
                        {{member.displayName}}, {{member.dateOfBirth | age}}
                    </div>
                    <div class="text-sm opacity-70 mt-1">
                        {{member.city}}, {{member.country}}
                    </div>
                </div>

                <div class="divider my-3"></div>

                <ul class="menu bg-base-200/50 rounded-box w-full text-base font-medium p-2 space-y-1">
                    <li>
                        <a routerLink="profile" routerLinkActive="active font-semibold text-primary" class="py-2.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                            </svg>
                            Profile
                        </a>
                    </li>
                    <li>
                        <a routerLink="photos" routerLinkActive="active font-semibold text-primary" class="py-2.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                              <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                            </svg>
                            Photos
                        </a>
                    </li>
                    <li>
                        <a routerLink="messages" routerLinkActive="active font-semibold text-primary" class="py-2.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
                            </svg>
                            Messages
                        </a>
                    </li>
                </ul>
            </div>

            <div class="card-actions justify-between gap-3 pt-6">
                <button routerLink="/members" class="btn btn-neutral btn-sm flex-1">Go back</button>
                <button class="btn btn-primary btn-sm flex-1">Like user</button>
            </div>
        </div>
    </div>

    <!-- Right Content Card -->
    <div class="card bg-base-100 shadow-xl border border-base-200 flex-1 w-full p-6 sm:p-8 rounded-2xl min-h-[75vh]">
        <div class="flex justify-between items-center pb-2">
            <h3 class="card-title text-3xl font-bold text-primary">{{title()}}</h3>
            @if (isCurrentUser()) {
                <button 
                    (click)="memberService.editMode.set(!memberService.editMode())"
                    class="btn btn-outline btn-primary btn-sm sm:btn-md">
                    {{memberService.editMode() ? 'Cancel' : 'Edit Profile'}}
                </button>
            }
        </div>

        <div class="divider my-2"></div>
        
        <div class="pt-2">
            <router-outlet />
        </div>
    </div>
</div>
} @else {
<div class="alert alert-warning shadow-lg max-w-md mx-auto mt-10">
    <span>Member not found</span>
</div>
}
